<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Neo-MoFox Launcher Next — AI Bot Orchestration</title>
  <desc id="desc">面向 Neo-MoFox QQ 机器人的 AI 产品式桌面编排控制台。一个实例由 MoFox、OneBot 适配器和实时终端组成，并持续反馈运行状态。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d0b"/>
      <stop offset="0.52" stop-color="#24130f"/>
      <stop offset="1" stop-color="#31231b"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7043"/>
      <stop offset="0.52" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="38%" r="55%">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#fed7aa" stroke-opacity="0.07"/>
    </pattern>
  </defs>

  <rect width="1200" height="420" rx="30" fill="url(#background)"/>
  <rect width="1200" height="420" rx="30" fill="url(#glow)"/>
  <rect width="1200" height="420" rx="30" fill="url(#grid)"/>

  <g id="identity" transform="translate(68 72)">
    <rect width="220" height="34" rx="17" fill="#ff7043" fill-opacity="0.14" stroke="#fb923c" stroke-opacity="0.65"/>
    <circle cx="21" cy="17" r="5" fill="#fdba74"/>
    <text x="38" y="23" fill="#ffedd5" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15" font-weight="700" letter-spacing="1.4">AI BOT ORCHESTRATION</text>
    <text x="0" y="100" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="56" font-weight="750" letter-spacing="-1.5">Neo-MoFox</text>
    <text x="0" y="160" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="56" font-weight="750" letter-spacing="-1.5">Launcher <tspan fill="#fb923c">Next</tspan></text>
    <text x="0" y="212" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="23">让机器人实例的安装、运行与诊断形成一个可观察的工作流。</text>
    <g transform="translate(0 258)">
      <rect width="434" height="40" rx="10" fill="#1c120f" fill-opacity="0.88" stroke="#69402b"/>
      <text x="17" y="26" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16">Electron 43  /  Vue 3  /  TypeScript  /  PTY</text>
    </g>
  </g>

  <g id="orchestration-proof" transform="translate(692 62)">
    <text x="0" y="0" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="700" letter-spacing="1.5">LIVE INSTANCE GRAPH</text>
    <rect x="0" y="26" width="440" height="282" rx="22" fill="#18100e" fill-opacity="0.82" stroke="#71452f"/>

    <g id="instance-node" transform="translate(30 60)">
      <rect width="166" height="82" rx="16" fill="#3a1f17" stroke="#ff7043" stroke-width="2"/>
      <circle cx="24" cy="26" r="8" fill="#fb923c"/>
      <text x="42" y="31" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="700">my-qq-bot</text>
      <text x="20" y="61" fill="#fed7aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">INSTANCE / ACTIVE</text>
    </g>

    <path d="M196 101C239 101 236 89 274 89" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
    <path d="M196 101C240 101 238 207 274 207" fill="none" stroke="url(#flow)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="237" cy="97" r="5" fill="#f59e0b"/>
    <circle cx="239" cy="160" r="5" fill="#34d399"/>

    <g id="mofox-node" transform="translate(274 54)">
      <rect width="136" height="70" rx="14" fill="#3b2714" stroke="#f59e0b" stroke-width="2"/>
      <text x="18" y="30" fill="#fef3c7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">MoFox</text>
      <text x="18" y="53" fill="#fbbf24" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">CORE PROCESS</text>
    </g>
    <g id="platform-node" transform="translate(274 172)">
      <rect width="136" height="70" rx="14" fill="#12352b" stroke="#34d399" stroke-width="2"/>
      <text x="18" y="30" fill="#d1fae5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="18" font-weight="700">OneBot</text>
      <text x="18" y="53" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">ADAPTER</text>
    </g>

    <g id="feedback" transform="translate(30 253)">
      <rect width="380" height="34" rx="9" fill="#201612"/>
      <circle cx="18" cy="17" r="5" fill="#34d399"/>
      <text x="34" y="23" fill="#d6c7bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="15">PTY streaming · status synchronized</text>
    </g>
  </g>
</svg>
