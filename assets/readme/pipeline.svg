<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">六阶段安装流水线</title>
  <desc id="pipeline-desc">从 GitHub Release 安装一个 Bot 平台实例的六阶段流水线：准备、下载、解压、依赖、配置、完成，每阶段实时上报进度事件，失败可从断点续跑。</desc>

  <!-- MD3 tonal-spot scheme, seed #367BF0, dark -->
  <rect width="1200" height="300" rx="28" fill="#121318"/>

  <!-- header -->
  <text x="64" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="28" font-weight="500" fill="#E2E2E9">安装流水线</text>
  <text x="64" y="96" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="18" fill="#C5C6D0">从 GitHub Release 到可运行实例 · 实时进度 · 失败可断点续跑</text>

  <!-- progress rail -->
  <rect x="154" y="167" width="892" height="6" rx="3" fill="#33353A"/>
  <rect x="154" y="167" width="486" height="6" rx="3" fill="#AEC6FF"/>

  <!-- done stages -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
    <circle cx="154" cy="170" r="20" fill="#2D4678"/>
    <path d="M 146 170 L 152 176 L 163 163" stroke="#D8E2FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="154" y="222" text-anchor="middle" font-size="20" font-weight="500" fill="#E2E2E9">准备</text>

    <circle cx="332" cy="170" r="20" fill="#2D4678"/>
    <path d="M 324 170 L 330 176 L 341 163" stroke="#D8E2FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="332" y="222" text-anchor="middle" font-size="20" font-weight="500" fill="#E2E2E9">下载</text>

    <circle cx="510" cy="170" r="20" fill="#2D4678"/>
    <path d="M 502 170 L 508 176 L 519 163" stroke="#D8E2FF" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="510" y="222" text-anchor="middle" font-size="20" font-weight="500" fill="#E2E2E9">解压</text>

    <!-- active stage -->
    <circle cx="688" cy="170" r="27" fill="none" stroke="#AEC6FF" stroke-width="2" opacity="0.25"/>
    <circle cx="688" cy="170" r="20" fill="#AEC6FF"/>
    <rect x="684" y="163" width="8" height="14" rx="3" fill="#132F60"/>
    <text x="688" y="222" text-anchor="middle" font-size="20" font-weight="500" fill="#AEC6FF">依赖</text>

    <!-- upcoming stages -->
    <circle cx="866" cy="170" r="20" fill="#33353A" stroke="#44474F" stroke-width="1.5"/>
    <text x="866" y="222" text-anchor="middle" font-size="20" fill="#8E9099">配置</text>

    <circle cx="1044" cy="170" r="20" fill="#33353A" stroke="#44474F" stroke-width="1.5"/>
    <text x="1044" y="222" text-anchor="middle" font-size="20" fill="#8E9099">完成</text>
  </g>

  <!-- stage ids -->
  <g font-family="'JetBrains Mono', 'Cascadia Mono', Consolas, ui-monospace, monospace" font-size="15" text-anchor="middle">
    <text x="154" y="246" fill="#8E9099">prepare</text>
    <text x="332" y="246" fill="#8E9099">download</text>
    <text x="510" y="246" fill="#8E9099">extract</text>
    <text x="688" y="246" fill="#AEC6FF">deps · 62%</text>
    <text x="866" y="246" fill="#5A5C63">config</text>
    <text x="1044" y="246" fill="#5A5C63">done</text>
  </g>

  <!-- footer assist chips -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="17">
    <rect x="64" y="262" width="150" height="30" rx="15" fill="none" stroke="#44474F" stroke-width="1.5"/>
    <text x="139" y="282" text-anchor="middle" fill="#C5C6D0">GitHub Release</text>
    <rect x="226" y="262" width="106" height="30" rx="15" fill="none" stroke="#44474F" stroke-width="1.5"/>
    <text x="279" y="282" text-anchor="middle" fill="#C5C6D0">镜像轮询</text>
    <rect x="344" y="262" width="134" height="30" rx="15" fill="none" stroke="#44474F" stroke-width="1.5"/>
    <text x="411" y="282" text-anchor="middle" fill="#C5C6D0">SHA-256 校验</text>
    <rect x="490" y="262" width="106" height="30" rx="15" fill="none" stroke="#44474F" stroke-width="1.5"/>
    <text x="543" y="282" text-anchor="middle" fill="#C5C6D0">分块下载</text>
    <rect x="608" y="262" width="106" height="30" rx="15" fill="none" stroke="#44474F" stroke-width="1.5"/>
    <text x="661" y="282" text-anchor="middle" fill="#C5C6D0">入口探测</text>
  </g>
</svg>
