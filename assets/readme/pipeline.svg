<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="pipeline-title pipeline-desc">
  <title id="pipeline-title">六阶段安装流水线</title>
  <desc id="pipeline-desc">从 GitHub Release 安装一个 Bot 平台实例的六阶段流水线：准备、下载、解压、依赖、配置、完成，每阶段实时上报进度事件，失败可重试。</desc>

  <defs>
    <linearGradient id="pipeBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171A21"/>
      <stop offset="1" stop-color="#0E1014"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="280" rx="24" fill="url(#pipeBg)"/>

  <!-- header -->
  <g transform="translate(64 56)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
    <text x="0" y="0" font-size="15" letter-spacing="1.5" fill="#8B90A0">INSTALL PIPELINE</text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="22" font-weight="600" fill="#E6E1E5">六阶段后台流水线 · 实时进度事件 · 失败可重试</text>
  </g>

  <!-- stages -->
  <g transform="translate(64 128)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <!-- connecting line -->
    <line x1="40" y1="40" x2="1056" y2="40" stroke="#2A2F3A" stroke-width="2"/>
    <line x1="40" y1="40" x2="700" y2="40" stroke="#4DD0E1" stroke-width="2"/>

    <!-- stages: prepare, download, extract, deps, config, done -->
    <g transform="translate(0 0)">
      <circle cx="40" cy="40" r="18" fill="#0E1014" stroke="#4DD0E1" stroke-width="2"/>
      <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#4DD0E1">✓</text>
      <text x="40" y="84" text-anchor="middle" font-size="15" fill="#E6E1E5">准备</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5A6070">prepare</text>
    </g>

    <g transform="translate(203 0)">
      <circle cx="40" cy="40" r="18" fill="#0E1014" stroke="#4DD0E1" stroke-width="2"/>
      <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#4DD0E1">✓</text>
      <text x="40" y="84" text-anchor="middle" font-size="15" fill="#E6E1E5">下载</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5A6070">download</text>
    </g>

    <g transform="translate(406 0)">
      <circle cx="40" cy="40" r="18" fill="#0E1014" stroke="#4DD0E1" stroke-width="2"/>
      <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#4DD0E1">✓</text>
      <text x="40" y="84" text-anchor="middle" font-size="15" fill="#E6E1E5">解压</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#5A6070">extract</text>
    </g>

    <!-- in-progress stage -->
    <g transform="translate(609 0)">
      <circle cx="40" cy="40" r="18" fill="#FF8A65" stroke="#FF8A65" stroke-width="2"/>
      <circle cx="40" cy="40" r="24" fill="none" stroke="#FF8A65" stroke-width="2" opacity="0.3"/>
      <text x="40" y="46" text-anchor="middle" font-size="16" font-weight="600" fill="#0E1014">▌</text>
      <text x="40" y="84" text-anchor="middle" font-size="15" font-weight="600" fill="#FF8A65">依赖</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#FF8A65">deps · 62%</text>
    </g>

    <g transform="translate(812 0)">
      <circle cx="40" cy="40" r="18" fill="#0E1014" stroke="#2A2F3A" stroke-width="2"/>
      <text x="40" y="84" text-anchor="middle" font-size="15" fill="#5A6070">配置</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3D4250">config</text>
    </g>

    <g transform="translate(1015 0)">
      <circle cx="40" cy="40" r="18" fill="#0E1014" stroke="#2A2F3A" stroke-width="2"/>
      <text x="40" y="84" text-anchor="middle" font-size="15" fill="#5A6070">完成</text>
      <text x="40" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" fill="#3D4250">done</text>
    </g>
  </g>

  <!-- footer detail -->
  <g transform="translate(64 252)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" fill="#5A6070">
    <text x="0" y="0">github release · 镜像顺序轮询 · SHA-256 校验 · 断点续传 · 解压结构校验 · 入口智能探测</text>
  </g>
</svg>
