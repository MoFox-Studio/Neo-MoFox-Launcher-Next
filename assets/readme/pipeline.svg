<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">安装智能体工作流</title>
  <desc id="desc">Neo-MoFox Launcher Next 将适配器安装作为可恢复工作流执行：准备、下载、解压、依赖、配置和完成；失败可重试，取消会清理临时文件。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#120d0b"/>
      <stop offset="1" stop-color="#302117"/>
    </linearGradient>
    <linearGradient id="progress" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7043"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#background)"/>
  <g transform="translate(64 66)">
    <text x="0" y="0" fill="#fdba74" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" letter-spacing="1.5">INSTALL WORKFLOW</text>
    <text x="0" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="29" font-weight="700">每个安装步骤都有状态、恢复路径和清理边界。</text>
  </g>

  <g id="workflow" transform="translate(64 165)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
    <path d="M44 0H1027" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
    <path d="M44 0H835" stroke="url(#progress)" stroke-width="4" stroke-linecap="round"/>

    <g transform="translate(0 0)">
      <circle cx="44" cy="0" r="22" fill="#ff7043"/><text x="44" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">✓</text>
      <text x="44" y="57" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="650">准备</text>
    </g>
    <g transform="translate(197 0)">
      <circle cx="44" cy="0" r="22" fill="#fb7f37"/><text x="44" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">✓</text>
      <text x="44" y="57" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="650">下载</text>
    </g>
    <g transform="translate(394 0)">
      <circle cx="44" cy="0" r="22" fill="#f59e0b"/><text x="44" y="7" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">✓</text>
      <text x="44" y="57" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="650">解压</text>
    </g>
    <g transform="translate(591 0)">
      <circle cx="44" cy="0" r="22" fill="#fbbf24"/><text x="44" y="7" text-anchor="middle" fill="#2a1705" font-size="18" font-weight="700">✓</text>
      <text x="44" y="57" text-anchor="middle" fill="#e2e8f0" font-size="19" font-weight="650">依赖</text>
    </g>
    <g transform="translate(788 0)">
      <circle cx="44" cy="0" r="22" fill="#12352b" stroke="#34d399" stroke-width="3"/><circle cx="44" cy="0" r="8" fill="#34d399"/>
      <text x="44" y="57" text-anchor="middle" fill="#6ee7b7" font-size="19" font-weight="700">配置</text>
    </g>
    <g transform="translate(985 0)">
      <circle cx="44" cy="0" r="22" fill="#201612" stroke="#665044" stroke-width="3"/><text x="44" y="7" text-anchor="middle" fill="#94a3b8" font-size="18" font-weight="700">6</text>
      <text x="44" y="57" text-anchor="middle" fill="#94a3b8" font-size="19" font-weight="650">完成</text>
    </g>
  </g>

  <g transform="translate(64 274)">
    <rect width="1072" height="1" fill="#594033"/>
    <text x="0" y="-14" fill="#d6c7bc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">FAILED STEP → retry without repeating completed work   ·   CANCELLED → temporary workspace removed</text>
  </g>
</svg>
