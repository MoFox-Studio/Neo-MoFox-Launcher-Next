appId: com.neomofox.launcher
productName: Neo-MoFox Launcher
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@lydell/node-pty/**
# 便携版 NSIS 加固钩子：把解包目录的无条件 RMDir /r 改为占用探测，
# 修复运行中实例的 node-pty 原生模块被删导致的启动失败（见 scripts/portable-nsis-patch.cjs）
afterPack: ./scripts/portable-nsis-patch.cjs
extraResources:
  - from: assets/images/icon.ico
    to: icon.ico
  - from: assets/images/icon.png
    to: icon.png
  # 版本号文件：每夜构建流水线在打包前重写，运行期用于展示构建信息与更新比较
  - from: version.json
    to: version.json
win:
  target:
    - nsis
    - portable
  icon: assets/images/icon.ico
nsis:
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-win-${arch}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-win-${arch}-portable.${ext}'
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: MoFox-Studio/Yishan <wwwww95915@qq.com>
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-linux-${arch}.${ext}'
  category: Utility
mac:
  target:
    - dmg
publish: null
npmRebuild: false
