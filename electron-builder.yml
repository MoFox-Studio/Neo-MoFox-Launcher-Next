appId: com.neomofox.launcher
productName: Neo-MoFox Launcher
directories:
  output: release
files:
  - dist/**
  - package.json
asar: true
asarUnpack:
  - node_modules/node-pty/**
  - node_modules/@lydell/node-pty/**
extraResources:
  - from: assets/images/icon.ico
    to: icon.ico
win:
  target:
    - nsis
    - portable
  icon: assets/images/icon.ico
nsis:
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-${arch}-setup.${ext}'
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-${arch}-portable.${ext}'
linux:
  target:
    - AppImage
    - deb
    - rpm
  maintainer: MoFox-Studio/Yishan <wwwww95915@qq.com>
  artifactName: 'Neo-MoFox-Launcher-${env.BUILD_DATE}-nightly-linux-${arch}.${ext}'
  category: Utility
mac:
  target:
    - dmg
publish: null
npmRebuild: false