name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows application
        run: npm run pack:dir

      - name: Create distributable archive
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked -DestinationPath release/Neo-MoFox-Launcher-Windows-x64.zip

      - name: Upload nightly artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neo-mofox-launcher-nightly-windows-x64-${{ github.run_number }}
          path: release/Neo-MoFox-Launcher-Windows-x64.zip
          if-no-files-found: error
          retention-days: 7
