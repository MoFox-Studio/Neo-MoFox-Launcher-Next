name: Nightly Build

on:
  schedule:
    - cron: '0 2 * * *'
      timezone: Asia/Shanghai

permissions:
  contents: read

concurrency:
  group: nightly-build
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows application
        run: npm run package:win

      - name: Upload nightly artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neo-mofox-launcher-nightly-windows-x64-${{ github.run_number }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish nightly release
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download nightly artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neo-mofox-launcher-nightly-windows-x64-${{ github.run_number }}
          path: artifacts

      - name: Update nightly release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" \
              -f sha="$TARGET_SHA" \
              -F force=true
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref='refs/tags/nightly' \
              -f sha="$TARGET_SHA"
          fi

          cat > release-notes.md <<EOF
          Automated nightly build from commit [$TARGET_SHA](https://github.com/$GITHUB_REPOSITORY/commit/$TARGET_SHA).

          This is an automated prerelease and may be unstable.
          EOF

          if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit nightly \
              --repo "$GITHUB_REPOSITORY" \
              --title 'Nightly Build' \
              --notes-file release-notes.md \
              --prerelease \
              --latest=false
            gh release upload nightly artifacts/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create nightly artifacts/*.exe \
              --repo "$GITHUB_REPOSITORY" \
              --target "$TARGET_SHA" \
              --title 'Nightly Build' \
              --notes-file release-notes.md \
              --prerelease
          fi
