name: Manual Build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: Create a GitHub Release from this build
        required: true
        default: false
        type: boolean
      release_tag:
        description: Release tag, required when creating a release (for example, v0.1.0)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Package Windows application
        run: npm run pack:dir

      - name: Create distributable archive
        shell: pwsh
        run: Compress-Archive -Path release/win-unpacked -DestinationPath release/Neo-MoFox-Launcher-Windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: neo-mofox-launcher-windows-x64-${{ github.run_number }}
          path: release/Neo-MoFox-Launcher-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    if: ${{ inputs.create_release }}
    needs: build-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          if [[ -z "$RELEASE_TAG" ]]; then
            echo "release_tag is required when create_release is enabled." >&2
            exit 1
          fi

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: neo-mofox-launcher-windows-x64-${{ github.run_number }}
          path: artifacts

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          TARGET_SHA: ${{ github.sha }}
        run: gh release create "$RELEASE_TAG" artifacts/Neo-MoFox-Launcher-Windows-x64.zip --target "$TARGET_SHA" --generate-notes
