name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: 类型、规范、测试与构建
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI_BUILD_ID: ${{ github.run_number }}-${{ github.run_attempt }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: 检出仓库
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: 安装 Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 检查格式
        run: npm run format:check

      - name: 静态检查
        run: npm run lint

      - name: 类型检查
        run: npm run typecheck

      - name: 单元测试
        run: npm test

      - name: 生产构建
        run: npm run build

      - name: 重建 Electron 原生模块
        run: npm run rebuild:native

      - name: Electron 与 PTY 冒烟测试 (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx electron scripts/native-smoke.cjs --no-sandbox

      - name: Electron 与 PTY 冒烟测试 (Windows)
        if: runner.os == 'Windows'
        run: npx electron scripts/native-smoke.cjs

      - name: 安装 Linux 打包依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg fakeroot

      - name: 打包 Windows x64 测试包
        if: runner.os == 'Windows'
        run: npx electron-builder --win --x64 --publish never --config electron-builder.ci.yml

      - name: 打包 Linux x64 测试包
        if: runner.os == 'Linux'
        run: npx electron-builder --linux --x64 --publish never --config electron-builder.ci.yml

      - name: 检查测试包完整性
        shell: pwsh
        run: |
          $prefix = "release/ci/Neo-MoFox-Launcher-ci-$env:CI_BUILD_ID"
          $suffixes = if ($IsWindows) { @('-win-x64-setup.exe', '-win-x64-portable.exe') } else { @('-linux-x64.AppImage', '-linux-x64.deb') }
          foreach ($suffix in $suffixes) {
            $file = "$prefix$suffix"
            if (-not (Test-Path -LiteralPath $file) -or (Get-Item -LiteralPath $file).Length -eq 0) {
              throw "测试包缺失或为空：$file"
            }
          }

      - name: 上传可下载的 CI 测试包
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Neo-MoFox-ci-${{ github.run_number }}-${{ github.run_attempt }}-${{ runner.os }}-x64
          path: |
            release/ci/*-setup.exe
            release/ci/*-portable.exe
            release/ci/*.AppImage
            release/ci/*.deb
          if-no-files-found: error
          retention-days: 14
